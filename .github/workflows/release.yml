# Publishes the installers (build.yml) as a GitHub release:
#
# - a tag vX.Y.Z (matching pyproject.toml's version) makes the release "Urakatsu X.Y.Z". The tag
#   normally comes from merging the release PR (release-pr.yml), which has already created the
#   release with its changelog; a tag pushed by hand gets its notes from git-cliff here;
# - every night, and on demand, the "nightly" pre-release is rebuilt from main when main has
#   moved since the last one, with the changes since the last release as its notes.

name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version, or whether main moved
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::The tag $GITHUB_REF_NAME does not match pyproject.toml's version $version"
              exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Nightly builds come from main; run this on main or push a vX.Y.Z tag"
            exit 1
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]] && [[ "$(git ls-remote origin refs/tags/nightly | cut -f1)" == "$GITHUB_SHA" ]]; then
            echo "The nightly build is already at $GITHUB_SHA"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'nightly' }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ github.token }}  # git-cliff's GitHub data (contributors)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: .github/release-please/package-lock.json

      - name: Install git-cliff
        run: |
          npm ci --ignore-scripts --prefix .github/release-please
          echo "$PWD/.github/release-please/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Created by the release PR, with its changelog as the notes.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Urakatsu ${GITHUB_REF_NAME#v}"
          else
            git-cliff --current --strip all > notes.md
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Urakatsu ${GITHUB_REF_NAME#v}" \
              --notes-file notes.md \
              --verify-tag
          fi

      - name: Publish the nightly build
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Nightly builds have the newest changes and may break."
            echo
            git-cliff --unreleased --strip all | sed '1s/^## \[unreleased\]$/## Changes since the last release/'
          } > notes.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --title "Nightly" \
            --notes-file notes.md \
            --prerelease \
            --target "$GITHUB_SHA"
