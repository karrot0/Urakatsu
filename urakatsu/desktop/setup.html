<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Urakatsu</title>
    <style>
      /* The workspace UI's tokens (web/src/styles.css), trimmed to what this page uses. */
      :root {
        --surface: oklch(1 0 0);
        --surface-sunk: oklch(0.985 0.002 85);
        --text: oklch(0.235 0.006 85);
        --text-2: oklch(0.582 0.007 85);
        --text-3: oklch(0.68 0.007 85);
        --border-soft: color-mix(in oklab, oklch(0.165 0.005 85) 7%, transparent);
        --hover: color-mix(in oklab, oklch(0.165 0.005 85) 6%, transparent);
        --accent: oklch(0.58 0.17 250);
        --accent-hover: oklch(0.53 0.17 250);
        --on-accent: oklch(0.99 0 0);
        --success: oklch(0.52 0.13 150);
        --danger: oklch(0.53 0.19 20);
        --danger-weak: oklch(0.96 0.03 20);
        --danger-line: oklch(0.89 0.06 20);
        --track: oklch(0.967 0.003 85);
        --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, "Yu Gothic UI", sans-serif;
        --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: oklch(0.205 0.004 85);
          --surface-sunk: oklch(0.245 0.004 85);
          --text: oklch(0.948 0.004 85);
          --text-2: oklch(0.74 0.006 85);
          --text-3: oklch(0.62 0.006 85);
          --border-soft: color-mix(in oklab, white 9%, transparent);
          --hover: color-mix(in oklab, white 5.5%, transparent);
          --accent: oklch(0.66 0.15 250);
          --accent-hover: oklch(0.71 0.14 250);
          --success: oklch(0.72 0.14 150);
          --danger: oklch(0.72 0.16 20);
          --danger-weak: oklch(0.29 0.05 20);
          --danger-line: oklch(0.4 0.08 20);
          --track: oklch(0.27 0.004 85);
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface);
        color: var(--text);
        font: 14px/20px var(--font);
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 520px;
        padding: 32px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 32px;
        font-weight: 600;
      }
      .mark {
        display: block;
        flex: none;
        width: 22px;
        height: 22px;
      }
      h1 {
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .message {
        margin-top: 4px;
        color: var(--text-2);
      }
      .bar {
        position: relative;
        height: 4px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--track);
      }
      .bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        border-radius: inherit;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          width: 100%;
          animation: none;
          opacity: 0.5;
        }
      }
      ol {
        margin-top: 24px;
        padding: 0 16px;
        border-radius: 10px;
        list-style: none;
        box-shadow: 0 1px 2px rgba(25, 25, 25, 0.03), 0 0 0 1px var(--border-soft);
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        box-shadow: inset 0 -1px 0 var(--border-soft);
        color: var(--text-2);
      }
      li:last-child {
        box-shadow: none;
      }
      li.active,
      li.done {
        color: var(--text);
      }
      li .dot {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        box-shadow: inset 0 0 0 1.5px var(--text-3);
      }
      li.active .dot {
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      li.active .dot::after {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
        content: "";
      }
      li.done .dot {
        background: var(--success);
        box-shadow: none;
      }
      li.done .dot::after {
        width: 6px;
        height: 3px;
        margin-top: -2px;
        border-bottom: 1.5px solid var(--surface);
        border-left: 1.5px solid var(--surface);
        content: "";
        transform: rotate(-45deg);
      }
      li.failed .dot {
        background: var(--danger);
        box-shadow: none;
      }
      .line {
        min-height: 16px;
        margin-top: 12px;
        overflow: hidden;
        color: var(--text-3);
        font: 12px/16px var(--font-mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .error {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--danger-weak);
        box-shadow: inset 0 0 0 1px var(--danger-line);
      }
      .error pre {
        max-height: 160px;
        margin-top: 8px;
        overflow: auto;
        color: var(--text-2);
        font: 12px/16px var(--font-mono);
        white-space: pre-wrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--border-soft);
        color: var(--text);
        font: 500 14px/20px var(--font);
        cursor: pointer;
        transition: background-color 20ms ease-in;
      }
      button:hover {
        background: var(--hover);
      }
      button.primary {
        background: var(--accent);
        box-shadow: none;
        color: var(--on-accent);
      }
      button.primary:hover {
        background: var(--accent-hover);
      }
      button:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>

    <script>
      // The desktop app drives this page with render({...}); see urakatsu/desktop/app.py.
      function render(state) {
        const $ = (id) => document.getElementById(id);
        $("title").textContent = state.title || "Starting Urakatsu";
        $("message").textContent = state.message || "";
        $("bar").hidden = !!state.error;
        $("line").textContent = state.error ? "" : state.line || "";
        const steps = state.steps || [];
        $("steps").hidden = steps.length === 0;
        $("steps").replaceChildren(
          ...steps.map((step) => {
            const item = document.createElement("li");
            item.className = step.status;
            const dot = document.createElement("span");
            dot.className = "dot";
            const label = document.createElement("span");
            label.textContent = step.title;
            item.append(dot, label);
            return item;
          }),
        );
        $("error").hidden = !state.error;
        $("error-text").textContent = state.error || "";
        $("actions").hidden = !state.error;
      }
    </script>
