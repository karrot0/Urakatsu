<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Urakatsu Setup</title>
    <style>
      /* Urakatsu's UI tokens (web/src/styles.css): warm neutrals, one accent, hairline shadows. */
      :root {
        --surface: oklch(1 0 0);
        --surface-sunk: oklch(0.985 0.002 85);
        --surface-fill: oklch(0.967 0.003 85);
        --text: oklch(0.235 0.006 85);
        --text-2: oklch(0.582 0.007 85);
        --text-3: oklch(0.68 0.007 85);
        --icon-2: oklch(0.68 0.007 85);
        --border-soft: color-mix(in oklab, oklch(0.165 0.005 85) 7%, transparent);
        --border: color-mix(in oklab, oklch(0.165 0.005 85) 11%, transparent);
        --hover: color-mix(in oklab, oklch(0.165 0.005 85) 6%, transparent);
        --press: color-mix(in oklab, oklch(0.165 0.005 85) 16%, transparent);
        --accent: oklch(0.58 0.17 250);
        --accent-hover: oklch(0.53 0.17 250);
        --accent-press: oklch(0.47 0.16 250);
        --on-accent: oklch(0.99 0 0);
        --success: oklch(0.52 0.13 150);
        --success-weak: oklch(0.96 0.04 150);
        --danger: oklch(0.53 0.19 20);
        --danger-hover: oklch(0.48 0.19 20);
        --on-danger: oklch(0.99 0 0);
        --danger-weak: oklch(0.96 0.03 20);
        --danger-line: oklch(0.89 0.06 20);
        --close-hover: oklch(0.58 0.21 27);
        --shadow-sm: 0 1px 2px rgba(25, 25, 25, 0.03), 0 0 0 1px var(--border-soft);
        --focus-ring: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
        --font: "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Segoe UI Variable Display", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Cascadia Mono", ui-monospace, Consolas, monospace;
        --ease: cubic-bezier(0.2, 1, 0.2, 1);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: oklch(0.205 0.004 85);
          --surface-sunk: oklch(0.245 0.004 85);
          --surface-fill: oklch(0.27 0.004 85);
          --text: oklch(0.948 0.004 85);
          --text-2: oklch(0.74 0.006 85);
          --text-3: oklch(0.62 0.006 85);
          --icon-2: oklch(0.62 0.006 85);
          --border-soft: color-mix(in oklab, white 9%, transparent);
          --border: color-mix(in oklab, white 14%, transparent);
          --hover: color-mix(in oklab, white 5.5%, transparent);
          --press: color-mix(in oklab, white 3%, transparent);
          --accent: oklch(0.66 0.15 250);
          --accent-hover: oklch(0.71 0.14 250);
          --accent-press: oklch(0.62 0.15 250);
          --on-accent: oklch(0.16 0.01 250);
          --success: oklch(0.72 0.14 150);
          --success-weak: oklch(0.3 0.05 150);
          --danger: oklch(0.72 0.16 20);
          --danger-hover: oklch(0.76 0.15 20);
          --on-danger: oklch(0.18 0.03 20);
          --danger-weak: oklch(0.29 0.05 20);
          --danger-line: oklch(0.4 0.08 20);
          --shadow-sm: 0 0 0 1px var(--border-soft);
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        color: var(--text);
        font: 14px/20px var(--font);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      svg {
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---- title bar ---- */
      .titlebar {
        display: flex;
        flex: none;
        align-items: center;
        height: 40px;
        padding-left: 16px;
      }
      .titlebar .drag {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 8px;
        height: 100%;
        color: var(--text-2);
        font-size: 12px;
      }
      .mark {
        display: block;
        flex: none;
        width: 18px;
        height: 18px;
      }
      .window-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 40px;
        border: 0;
        background: transparent;
        color: var(--text-2);
        transition: background-color 20ms ease-in;
      }
      .window-button:hover {
        background: var(--hover);
        color: var(--text);
      }
      .window-button.close:hover {
        background: var(--close-hover);
        color: white;
      }
      .window-button:focus-visible {
        outline: none;
        box-shadow: inset 0 0 0 2px var(--accent);
      }

      /* ---- screens ---- */
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding: 12px 40px 0;
        animation: enter 180ms var(--ease);
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .screen {
          animation: none;
        }
      }
      .hero {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .hero .logo {
        display: block;
        flex: none;
        width: 48px;
        height: 48px;
      }
      .hero .status-icon {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 999px;
      }
      .status-icon.success {
        background: var(--success-weak);
        color: var(--success);
      }
      .status-icon.danger {
        background: var(--danger-weak);
        color: var(--danger);
      }
      h1 {
        font: 600 24px/32px var(--font-display);
        letter-spacing: -0.01em;
      }
      .lede {
        margin-top: 2px;
        color: var(--text-2);
      }
      .content {
        flex: 1;
        min-height: 0;
        margin: 20px -8px 0;
        padding: 2px 8px 16px;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .section-label {
        margin: 20px 0 6px;
        color: var(--text-2);
        font-size: 12px;
        font-weight: 500;
      }
      .row .actions {
        display: flex;
        flex: none;
        gap: 4px;
      }

      /* ---- rows ---- */
      .card {
        padding: 0 16px;
        border-radius: 10px;
        box-shadow: var(--shadow-sm);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 56px;
        padding: 10px 0;
        box-shadow: inset 0 -1px 0 var(--border-soft);
      }
      .row:last-child {
        box-shadow: none;
      }
      .row .label {
        flex: 1;
        min-width: 0;
      }
      .row .title {
        font-weight: 500;
      }
      .row .detail {
        margin-top: 2px;
        overflow: hidden;
        color: var(--text-2);
        font-size: 12px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .path {
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .note {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-top: 12px;
        color: var(--text-2);
        font-size: 12px;
        line-height: 16px;
      }
      .note svg {
        margin-top: 0;
      }
      .note + .note {
        margin-top: 8px;
      }
      .note svg {
        color: var(--icon-2);
      }

      /* ---- controls ---- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--border);
        color: var(--text);
        font: 500 14px/20px var(--font);
        white-space: nowrap;
        transition: background-color 20ms ease-in;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:active {
        background: var(--press);
      }
      .btn.sm {
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
      }
      .btn.ghost {
        box-shadow: none;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--hover);
      }
      .btn.primary {
        background: var(--accent);
        box-shadow: none;
        color: var(--on-accent);
      }
      .btn.primary:hover {
        background: var(--accent-hover);
      }
      .btn.primary:active {
        background: var(--accent-press);
      }
      .btn.danger {
        background: var(--danger);
        box-shadow: none;
        color: var(--on-danger);
      }
      .btn.danger:hover {
        background: var(--danger-hover);
      }
      .btn:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }
      .switch {
        position: relative;
        flex: none;
        width: 32px;
        height: 18px;
        border: 0;
        border-radius: 999px;
        background: var(--surface-fill);
        box-shadow: inset 0 0 0 1px var(--border);
        transition: background-color 100ms ease-out;
      }
      .switch::after {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--text-2);
        content: "";
        transition: transform 150ms var(--ease), background-color 100ms ease-out;
      }
      .switch[aria-checked="true"] {
        background: var(--accent);
        box-shadow: none;
      }
      .switch[aria-checked="true"]::after {
        background: var(--on-accent);
        transform: translateX(14px);
      }
      .switch.danger[aria-checked="true"] {
        background: var(--danger);
      }
      .switch:focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      /* ---- progress ---- */
      .bar-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bar {
        position: relative;
        flex: 1;
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--surface-fill);
      }
      .bar > span {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: inherit;
        background: var(--accent);
        transition: width 300ms var(--ease);
      }
      .percent {
        width: 40px;
        color: var(--text-2);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .steps {
        margin-top: 20px;
        padding: 0 16px;
        border-radius: 10px;
        list-style: none;
        box-shadow: var(--shadow-sm);
      }
      .steps li {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        box-shadow: inset 0 -1px 0 var(--border-soft);
        color: var(--text-3);
      }
      .steps li:last-child {
        box-shadow: none;
      }
      .steps li.active,
      .steps li.done {
        color: var(--text);
      }
      .steps .step-title {
        flex: 1;
      }
      .steps .step-detail {
        color: var(--text-2);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .dot {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        box-shadow: inset 0 0 0 1.5px var(--border);
      }
      li.active .dot {
        box-shadow: inset 0 0 0 2px var(--surface-fill);
        border: 2px solid transparent;
        border-top-color: var(--accent);
        animation: spin 800ms linear infinite;
      }
      li.done .dot {
        background: var(--success);
        box-shadow: none;
        color: var(--surface);
      }
      li.failed .dot {
        background: var(--danger);
        box-shadow: none;
        color: white;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        li.active .dot {
          animation: none;
          border-color: var(--accent);
        }
      }
      .log {
        height: 16px;
        margin-top: 12px;
        overflow: hidden;
        color: var(--text-3);
        font: 12px/16px var(--font-mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .details {
        max-height: 150px;
        padding: 12px 16px;
        overflow: auto;
        border-radius: 10px;
        background: var(--danger-weak);
        box-shadow: inset 0 0 0 1px var(--danger-line);
        color: var(--text-2);
        font: 12px/16px var(--font-mono);
        white-space: pre-wrap;
        user-select: text;
      }

      /* ---- footer ---- */
      footer {
        display: flex;
        flex: none;
        align-items: center;
        gap: 8px;
        height: 68px;
        padding: 0 40px;
        box-shadow: inset 0 1px 0 var(--border-soft);
        background: var(--surface-sunk);
      }
      footer .hint {
        flex: 1;
        color: var(--text-3);
        font-size: 12px;
      }
    </style>
  </head>

      <button class="window-button" aria-label="Minimize" onclick="send('minimize')">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 12h14" /></svg>
      </button>
      <button class="window-button close" aria-label="Close" onclick="send('close')">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
    <main id="main"></main>
    <footer id="footer"></footer>

    <script>
      // Urakatsu's installer page. The Rust host (packaging/launcher/src/ui.rs) calls render(state)
      // and receives commands through window.ipc.postMessage.
      const ICONS = {
        check: '<path d="M20 6 9 17l-5-5" />',
        alert: '<circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" />',
        cpu: '<rect width="16" height="16" x="4" y="4" rx="2" /><rect width="6" height="6" x="9" y="9" rx="1" /><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2" />',
        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />',
        info: '<circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" />',
        download: '<path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" />',
      };
      const icon = (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${ICONS[name]}</svg>`;
      const esc = (text) => String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const LOGO = document.querySelector(".mark").src; // the app icon, embedded once in the title bar
      const send = (cmd, data = {}) => window.ipc.postMessage(JSON.stringify({ cmd, ...data }));

      let state = /*STATE*/ null;
      let form = { desktop: true, everything: false };
      let primary = null;
      let shown = null; // the screen currently in the DOM

      function render(next) {
        const sameScreen = next.screen === shown;
        shown = next.screen;
        state = next;
        if (next.home) form.home = next.home;
        const view = SCREENS[next.screen](next);
        const main = document.getElementById("main");
        if (sameScreen && next.screen === "progress") {
          updateProgress(next); // keep the list in place so bars animate
        } else {
          main.innerHTML = `<section class="screen">${view.body}</section>`;
        }
        document.getElementById("footer").innerHTML = view.footer;
        primary = view.primary || null;
        const focus = document.querySelector("[data-autofocus]");
        if (focus && !sameScreen) focus.focus({ focusVisible: false }); // Enter works; the ring shows once the keyboard is used
      }

      const toggle = (key, value, label, danger) =>
        `<button class="switch ${danger ? "danger" : ""}" role="switch" aria-checked="${value}" aria-label="${esc(label)}" onclick="form.${key} = !form.${key}; this.setAttribute('aria-checked', form.${key})"></button>`;

      const SCREENS = {
        welcome: (s) => {
          const verb = { install: "Install", update: "Update", reinstall: "Reinstall" }[s.mode || "install"];
          const lede =
            s.mode === "update"
              ? `Version ${esc(s.installed.version)} is installed; this installs ${esc(s.version)}. Your projects, models and settings stay.`
              : s.mode === "reinstall"
                ? `Version ${esc(s.version)} is already installed. Reinstalling repairs the app; your projects, models and settings stay.`
                : `Version ${esc(s.version)}. Detect, read, translate and typeset manga on your own computer.`;
          const others = s.others || [];
          return {
            body: `
            <div class="hero">
              <img class="logo" src="${LOGO}" alt="" draggable="false" />
              <div>
                <h1>${verb} Urakatsu</h1>
                <p class="lede">${lede}</p>
              </div>
            </div>
            <div class="content">
              <div class="card">
                <div class="row">
                  <div class="label"><p class="title">Install location</p><p class="detail path">${esc(s.install)}</p></div>
                </div>
                <div class="row">
                  <div class="label"><p class="title">Data folder</p><p class="detail"><span class="path">${esc(form.home)}</span>. ${dataSummary(s)}</p></div>
                  <button class="btn sm" onclick="send('pick-home')">${icon("folder", 14)} Change</button>
                </div>
                <div class="row">
                  <div class="label"><p class="title">Models folder</p><p class="detail"><span class="path">${esc(s.models.path)}</span>. ${modelsSummary(s.models)}</p></div>
                  <div class="actions">
                    ${s.models_default ? "" : `<button class="btn sm ghost" onclick="send('reset-models')">Use default</button>`}
                    <button class="btn sm" onclick="send('pick-models')">${icon("folder", 14)} Change</button>
                  </div>
                </div>
                ${
                  s.desktop_option === false
                    ? ""
                    : `<div class="row">
                  <div class="label"><p class="title">Desktop shortcut</p></div>
                  ${toggle("desktop", form.desktop, "Desktop shortcut")}
                </div>`
                }
              </div>
              ${
                others.length
                  ? `<p class="section-label">Found on this computer</p>
                     <div class="card">${others
                       .map(
                         (o) => `<div class="row">
                           <div class="label"><p class="title path">${esc(o.path)}</p><p class="detail">${homeSummary(o)}</p></div>
                           <button class="btn sm" onclick="send('use-home', { path: ${esc(JSON.stringify(o.path))} })">Use</button>
                         </div>`,
                       )
                       .join("")}</div>`
                  : ""
              }
              <p class="note">${icon("cpu")} ${esc(s.gpu)}</p>
              ${s.storage ? `<p class="note">${icon("info")} ${esc(s.storage)}</p>` : ""}
            </div>`,
            footer: `
            <p class="hint">${icon("shield", 12)} Installs for your account only. No administrator rights needed.</p>
            <button class="btn ghost" onclick="send('close')">Cancel</button>
            <button class="btn primary" data-autofocus onclick="install()">${icon("download", 14)} ${verb}</button>`,
            primary: install,
          };
        },
        progress: (s) => ({
          body: `
            <div>
              <h1>${esc(s.title)}</h1>
              <p class="lede">${esc(s.lede)}</p>
            </div>
            <div class="content">
              <div class="bar-row"><div class="bar"><span id="bar" style="width:${s.percent || 0}%"></span></div><span class="percent" id="percent">${Math.round(s.percent || 0)}%</span></div>
              <ol class="steps" id="steps">${steps(s.steps || [])}</ol>
              <p class="log" id="log">${esc(s.line)}</p>
            </div>`,
          footer: `<p class="hint">${esc(s.hint || "")}</p>${s.cancellable ? `<button class="btn ghost" onclick="send('cancel')">Cancel</button>` : ""}`,
        }),
        done: (s) => ({
          body: `
            <div class="hero">
              <span class="status-icon success">${icon("check", 24)}</span>
              <div><h1>${esc(s.title)}</h1><p class="lede">${esc(s.lede)}</p></div>
            </div>
            ${(s.rows || []).length ? `<div class="content"><div class="card">${s.rows.map((r) => `<div class="row"><div class="label"><p class="title">${esc(r.title)}</p><p class="detail ${r.path ? "path" : ""}">${esc(r.detail)}</p></div></div>`).join("")}</div></div>` : ""}`,
          footer: s.launch
            ? `<p class="hint"></p><button class="btn ghost" onclick="send('close')">Close</button><button class="btn primary" data-autofocus onclick="send('launch')">Open Urakatsu</button>`
            : `<p class="hint"></p><button class="btn primary" data-autofocus onclick="send('close')">Close</button>`,
          primary: () => send(s.launch ? "launch" : "close"),
        }),
        error: (s) => ({
          body: `
            <div class="hero">
              <span class="status-icon danger">${icon("alert", 24)}</span>
              <div><h1>${esc(s.title)}</h1><p class="lede">${esc(s.lede)}</p></div>
            </div>
            <div class="content">${s.details ? `<pre class="details">${esc(s.details)}</pre>` : ""}</div>`,
          footer: `
            <p class="hint"></p>
            <button class="btn ghost" onclick="send('open-log')">Open log</button>
            <button class="btn" onclick="send('close')">Close</button>
            ${s.retry ? `<button class="btn primary" data-autofocus onclick="send('retry')">Try again</button>` : ""}`,
          primary: s.retry ? () => send("retry") : null,
        }),
        uninstall: (s) => ({
          body: `
            <div class="hero">
              <img class="logo" src="${LOGO}" alt="" draggable="false" />
              <div><h1>Uninstall Urakatsu</h1><p class="lede">Removes the app, its shortcuts and its Python environment.</p></div>
            </div>
            <div class="content">
              <div class="card">
                <div class="row">
                  <div class="label"><p class="title">Also delete my projects, models and settings</p><p class="detail">Everything in <span class="path">${esc(s.home)}</span>. This cannot be undone.</p></div>
                  ${toggle("everything", form.everything, "Also delete my projects, models and settings", true)}
                </div>
              </div>
            </div>`,
          footer: `
            <p class="hint"></p>
            <button class="btn ghost" data-autofocus onclick="send('close')">Cancel</button>
            <button class="btn danger" onclick="send('uninstall', { everything: form.everything })">Uninstall</button>`,
        }),
      };

      const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
      function size(bytes) {
        if (bytes >= 1024 ** 3) return `${(bytes / 1024 ** 3).toFixed(1)} GB`;
        if (bytes >= 1024 ** 2) return `${Math.round(bytes / 1024 ** 2)} MB`;
        return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      }
      const modelCount = (m) => (m.catalog || 0) + (m.downloaded || 0);
      function modelsSummary(m) {
        if (!modelCount(m)) return m.exists ? "No models yet. They download here when a stage first needs one." : "New folder. Models download here when a stage first needs one.";
        const total = m.bytes == null ? "" : `, ${size(m.bytes)}`; // sizes arrive a moment after the screen
        return `${plural(modelCount(m), "model", "models")} found${total}. Urakatsu uses them as they are.`;
      }
      function dataSummary(s) {
        const what = s.storage ? "Projects and settings" : "Projects, settings and the Python environment";
        if (!s.data.exists) return `New folder. ${what}; plan for 10 GB or more with models.`;
        return s.data.projects ? `${plural(s.data.projects, "project", "projects")} already here; Urakatsu keeps using them.` : `Already set up here; Urakatsu keeps using it.`;
      }
      function homeSummary(o) {
        const parts = [plural(o.projects, "project", "projects")];
        const n = modelCount(o.models);
        parts.push(n ? `${plural(n, "model", "models")}${o.models.bytes == null ? "" : `, ${size(o.models.bytes)}`}` : "no models");
        return parts.join(" · ");
      }

      function steps(list) {
        return list
          .map(
            (step) => `
            <li class="${step.status}">
              <span class="dot">${step.status === "done" ? icon("check", 11) : ""}</span>
              <span class="step-title">${esc(step.title)}</span>
              <span class="step-detail">${esc(step.detail || "")}</span>
            </li>`,
          )
          .join("");
      }

      function updateProgress(s) {
        document.getElementById("bar").style.width = `${s.percent || 0}%`;
        document.getElementById("percent").textContent = `${Math.round(s.percent || 0)}%`;
        document.getElementById("steps").innerHTML = steps(s.steps || []);
        document.getElementById("log").textContent = s.line || "";
      }

      function install() {
        send("install", { desktop: form.desktop, home: form.home });
      }

      document.querySelector("[data-drag]").addEventListener("mousedown", (e) => e.button === 0 && send("drag"));
      document.addEventListener("contextmenu", (e) => e.preventDefault());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state && state.screen !== "progress") send("close");
        if (e.key === "Enter" && primary && document.activeElement?.tagName !== "BUTTON") primary();
      });
      render(state);
      send("ready"); // the host starts an update as soon as the page can show it
    </script>
  </body>
</html>
