[package]
name = "urakatsu-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
ureq = "3.5.0"
wry = "0.57.1"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1.8"
rfd = { version = "0.17.2", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_System_Com", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
libc = "0.2.191"
tar = "0.4.46"

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18.2"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
